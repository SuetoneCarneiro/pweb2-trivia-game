<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- meta tags e Tailwind CDN - comum a todos -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title th:text="${title}">Trivia Game</title>
</head>

<!-- cabeçalho do usuário comum -->
<header th:fragment="header-user(navLinks)"
        class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-indigo-700">Trivia Game</h1>
        <div class="flex items-center gap-4">
            <span class="text-sm text-gray-500">
                Olá, <span class="font-semibold text-gray-700" th:text="${session.participanteLogado.nome}">Usuário</span>
            </span>
            <th:block th:replace="${navLinks}" />
            <a th:href="@{/logout}" class="text-sm font-medium text-red-500 hover:text-red-700 transition">Sair</a>
        </div>
    </div>
</header>

<!-- Cabeçalho do admin -->
<header th:fragment="header-admin(navLinks)"
        class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
        <h1 class="text-2xl font-bold text-indigo-700">Trivia Game</h1>
        <div class="flex items-center gap-4">
            <th:block th:replace="${navLinks}" />
        </div>
    </div>
</header>

</html>
