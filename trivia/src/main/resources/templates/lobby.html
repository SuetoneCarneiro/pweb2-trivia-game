<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head th:replace="~{fragments/layout :: head('Trivia Game - Lobby')}"></head>
<body class="min-h-screen bg-gray-50">
    <header th:replace="~{fragments/layout :: header-user(~{:: #lobby-nav})}">
        <th:block id="lobby-nav">
            <a th:href="@{/ranking}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition">Ranking</a>
            <!-- Exibe link para admin apenas se tiver role ADMIN -->
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}" class="text-sm font-medium text-indigo-600 hover:text-indigo-800 transition">Admin</a>
        </th:block>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-gray-800">
                Corridas Disponíveis
            </h2>
            <p class="mt-1 text-gray-500">Escolha uma corrida para participar</p>
        </div>

        <div th:if="${mensagem}" class="mb-6 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700 text-sm" th:text="${mensagem}"></div>

        <!-- Grid de corridas (mesmo código anterior) -->
        <div th:if="${corridas}" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div th:each="corrida : ${corridas}" th:classappend="${#lists.contains(corridasRespondidasIds, corrida.id)} ? 'opacity-65 bg-gray-50/50 border-gray-200 shadow-none' : 'bg-white border-gray-100 shadow-md hover:shadow-xl'" class="rounded-2xl border transition-all duration-200 flex flex-col">
                <div class="p-6 flex-1">
                    <h3 class="text-xl font-bold mb-2" th:classappend="${#lists.contains(corridasRespondidasIds, corrida.id)} ? 'line-through text-gray-400' : 'text-gray-800'" th:text="${corrida.titulo}">Título</h3>
                    <p class="text-gray-500 text-sm mb-4 leading-relaxed" th:text="${corrida.descricao}">Descrição</p>
                    <div class="flex items-center gap-4 text-xs text-gray-400">
                        <span class="flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" />
                                <path d="M12 6v6l4 2" />
                            </svg>
                            <span th:text="${corrida.tempo} + 's'">0s</span>
                        </span>
                        <span class="flex items-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <span th:text="${corrida.perguntas.size()} + ' perguntas'">0 perguntas</span>
                        </span>
                    </div>
                </div>
                <div class="px-6 pb-6">
                    <div th:if="${#lists.contains(corridasRespondidasIds, corrida.id)}" class="space-y-2">
                        <div class="w-full text-center py-2.5 bg-green-50 border border-green-200 text-green-700 font-semibold rounded-xl flex items-center justify-center gap-1">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                            </svg>
                            Respondida
                        </div>
                        <a th:href="@{/ranking(corridaId=${corrida.id})}" class="block w-full text-center py-2 bg-indigo-50 border border-indigo-200 text-indigo-600 hover:bg-indigo-100 hover:border-indigo-300 font-medium text-sm rounded-xl transition-colors duration-200">Ver Ranking</a>
                    </div>
                    <a th:unless="${#lists.contains(corridasRespondidasIds, corrida.id)}" th:href="@{/corrida/iniciar/{id}(id=${corrida.id})}" class="block w-full text-center py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl transition-colors duration-200">Participar</a>
                </div>
            </div>
        </div>

        <div th:unless="${corridas}" class="text-center py-20">
            <svg class="mx-auto w-16 h-16 text-gray-300 mb-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                <path d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
            </svg>
            <p class="text-gray-400 text-lg">Nenhuma corrida ativa no momento.</p>
        </div>
    </main>
</body>
</html>
