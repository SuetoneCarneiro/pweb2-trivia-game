<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ranking Geral')}"></head>
<body class="min-h-screen bg-gray-50">

    <header th:replace="~{fragments/layout :: header-user(~{:: #ranking-nav})}">
        <th:block id="ranking-nav">
            <a th:href="@{/lobby}" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition">Lobby</a>
        </th:block>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-8 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
            <div>
                <h2 class="text-3xl font-extrabold text-gray-800"
                    th:text="${corridaSelecionada != null} ? 'Ranking - ' + ${corridaSelecionada.titulo} : 'Ranking Geral'">Ranking Geral</h2>
                <p class="mt-1 text-gray-500"
                   th:text="${corridaSelecionada != null} ? 'Resultados da corrida selecionada' : 'Os melhores resultados de todas as corridas'">Os melhores resultados de todas as corridas</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <!-- Filtro por corrida -->
                <form method="get" th:action="@{/ranking}" class="flex items-center gap-2">
                    <select name="corridaId" onchange="this.form.submit()"
                            class="text-sm border border-gray-300 rounded-lg px-3 py-2 bg-white text-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
                        <option value="">Todas as corridas</option>
                        <option th:each="c : ${corridas}" th:value="${c.id}" th:text="${c.titulo}"
                                th:selected="${corridaIdFiltro != null and corridaIdFiltro == c.id}">Corrida</option>
                    </select>
                </form>

                <!-- Seletor de Tamanho de Página -->
                <form method="get" th:action="@{/ranking}" class="flex items-center gap-2">
                    <input type="hidden" name="corridaId" th:value="${corridaIdFiltro}" />
                    <label for="sizeSelect" class="text-sm text-gray-600 font-medium">Itens por página:</label>
                    <select name="size" id="sizeSelect" onchange="this.form.submit()"
                            class="text-sm border border-gray-300 rounded-lg px-3 py-2 bg-white text-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none">
                        <option value="2" th:selected="${pageSize == 2}">2</option>
                        <option value="3" th:selected="${pageSize == 3}">3</option>
                        <option value="5" th:selected="${pageSize == 5}">5</option>
                        <option value="10" th:selected="${pageSize == 10}">10</option>
                        <option value="20" th:selected="${pageSize == 20}">20</option>
                    </select>
                    <input type="number" name="size" min="1" step="1" 
                           placeholder="Personalizado"
                           class="w-24 text-sm border border-gray-300 rounded-lg px-2 py-2 bg-white text-gray-700 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 outline-none"
                           th:value="${pageSize}" 
                           onchange="this.form.submit()" />
                </form>
            </div>
        </div>

        <!-- Tabela de ranking -->
        <div class="bg-white rounded-2xl shadow-md border border-gray-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-indigo-600 text-white text-sm uppercase tracking-wider">
                            <th class="px-6 py-4 font-semibold">#</th>
                            <th class="px-6 py-4 font-semibold">Participante</th>
                            <th class="px-6 py-4 font-semibold">Corrida</th>
                            <th class="px-6 py-4 font-semibold text-center">Pontuação</th>
                            <th class="px-6 py-4 font-semibold">Data/Hora</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:each="resultado, estat : ${resultados}"
                            class="hover:bg-indigo-50/50 transition-colors duration-150"
                            th:classappend="${estat.index % 2 == 0} ? 'bg-white' : 'bg-gray-50/50'">
                            <td class="px-6 py-4">
                                <span th:if="${estat.index == 0}" class="inline-flex items-center justify-center w-8 h-8 bg-yellow-100 text-yellow-700 font-bold rounded-full text-sm">1</span>
                                <span th:if="${estat.index == 1}" class="inline-flex items-center justify-center w-8 h-8 bg-gray-200 text-gray-600 font-bold rounded-full text-sm">2</span>
                                <span th:if="${estat.index == 2}" class="inline-flex items-center justify-center w-8 h-8 bg-amber-100 text-amber-700 font-bold rounded-full text-sm">3</span>
                                <span th:if="${estat.index > 2}" class="text-gray-400 font-medium pl-2" th:text="${estat.index + 1 + (currentPage * pageSize)}">4</span>
                            </td>
                            <td class="px-6 py-4 font-medium text-gray-800" th:text="${resultado.idParticipante.nome}">Nome</td>
                            <td class="px-6 py-4 text-gray-500" th:text="${resultado.idCorrida.titulo}">Corrida</td>
                            <td class="px-6 py-4 text-center">
                                <span class="inline-block bg-indigo-100 text-indigo-700 font-bold text-sm px-3 py-1 rounded-full"
                                      th:text="${resultado.pontuacao}">0</span>
                            </td>
                            <td class="px-6 py-4 text-gray-400 text-sm" th:text="${#temporals.format(resultado.dataHora, 'dd/MM/yyyy HH:mm')}">Data</td>
                        </tr>
                        <tr th:if="${resultados == null or resultados.empty}">
                            <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                                Nenhum resultado registrado ainda.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Navegação de páginas (Task 2.4) -->
        <div th:if="${totalPages > 1}" class="mt-6 flex flex-wrap items-center justify-center gap-2">
            <!-- Botão Anterior -->
            <a th:if="${currentPage > 0}" 
               th:href="@{/ranking(corridaId=${corridaIdFiltro}, page=${currentPage - 1}, size=${pageSize})}"
               class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow transition">
                Anterior
            </a>
            <span th:unless="${currentPage > 0}" 
                  class="px-4 py-2 bg-gray-200 text-gray-400 text-sm font-medium rounded-lg cursor-default">
                Anterior
            </span>

            <!-- Numeração de páginas -->
            <div class="flex gap-1">
                <!-- Página 1 sempre visível -->
                <a th:href="@{/ranking(corridaId=${corridaIdFiltro}, page=0, size=${pageSize})}"
                   class="px-3 py-2 rounded-lg text-sm font-medium transition"
                   th:classappend="${currentPage == 0} ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'">
                    1
                </a>

                <!-- Se houver páginas entre a primeira e a atual, mostrar "..." -->
                <span th:if="${currentPage > 2}" class="px-2 py-2 text-gray-400">…</span>

                <!-- Páginas próximas à atual (até 2 antes) -->
                <a th:each="i : ${#numbers.sequence(currentPage - 1, currentPage + 1)}"
                   th:if="${i > 0 and i < totalPages - 1}" 
                   th:href="@{/ranking(corridaId=${corridaIdFiltro}, page=${i}, size=${pageSize})}"
                   class="px-3 py-2 rounded-lg text-sm font-medium transition"
                   th:classappend="${i == currentPage} ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                   th:text="${i + 1}">
                </a>

                <!-- Se houver páginas entre a atual e a última, mostrar "..." -->
                <span th:if="${currentPage < totalPages - 3}" class="px-2 py-2 text-gray-400">…</span>

                <!-- Última página sempre visível (se houver mais de uma página) -->
                <a th:if="${totalPages > 1}"
                   th:href="@{/ranking(corridaId=${corridaIdFiltro}, page=${totalPages - 1}, size=${pageSize})}"
                   class="px-3 py-2 rounded-lg text-sm font-medium transition"
                   th:classappend="${currentPage == totalPages - 1} ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'"
                   th:text="${totalPages}">
                </a>
            </div>

            <!-- Botão Próxima -->
            <a th:if="${currentPage < totalPages - 1}" 
               th:href="@{/ranking(corridaId=${corridaIdFiltro}, page=${currentPage + 1}, size=${pageSize})}"
               class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg shadow transition">
                Próxima
            </a>
            <span th:unless="${currentPage < totalPages - 1}" 
                  class="px-4 py-2 bg-gray-200 text-gray-400 text-sm font-medium rounded-lg cursor-default">
                Próxima
            </span>
        </div>

        <!--  exibindo total de itens -->
        <div th:if="${totalPages > 0}" class="mt-4 text-center text-sm text-gray-400">
            Mostrando página <span th:text="${currentPage + 1}"></span> de <span th:text="${totalPages}"></span> 
            (total de <span th:text="${totalItems}"></span> resultados)
        </div>

    </main>
</body>
</html>
