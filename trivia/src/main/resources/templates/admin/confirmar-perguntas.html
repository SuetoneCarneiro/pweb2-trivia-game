<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Corrida Criada</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-500 via-purple-500 to-blue-600 flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <div class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl p-8 text-center">

            <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 rounded-full mb-5">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5"/>
                </svg>
            </div>

            <h1 class="text-2xl font-extrabold text-gray-800 mb-2">Corrida Criada!</h1>
            <p class="text-gray-500 mb-1">A corrida</p>
            <p class="text-lg font-bold text-indigo-700 mb-6" th:text="${corrida.titulo}">Título</p>

            <p class="text-gray-600 mb-8">Deseja cadastrar perguntas para esta corrida agora?</p>

            <div class="space-y-3">
                <a th:href="@{/admin/perguntas/{id}(id=${corrida.id})}"
                   class="block w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all duration-200">
                    Sim, cadastrar perguntas
                </a>
                <a th:href="@{/admin/dashboard}"
                   class="block w-full py-3 bg-white border-2 border-gray-200 hover:border-gray-300 text-gray-600 font-semibold rounded-xl transition-all duration-200">
                    Não, voltar ao dashboard
                </a>
            </div>

        </div>
    </div>

</body>
</html>
